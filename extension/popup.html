<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Ant Form Assistant</title>
<style>
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:300px;margin:0;padding:18px;color:#18211d;background:#f8faf7}
  h1{font-size:17px;margin:0 0 5px;color:#183c2d}.muted{color:#65736a;font-size:12px;margin:0 0 14px}
  button{width:100%;padding:11px;border:0;border-radius:9px;background:#1d6b4d;color:#fff;font-weight:700;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}#status{font-size:12px;margin-top:12px;white-space:pre-wrap}.note{font-size:11px;color:#6a756e;margin-top:12px}
</style>
<h1>Neural Ant</h1>
<p class="muted">Neural Ant detects job application forms and adds a fill button to the page.</p>
<button id="fill">Fill this application</button>
<div id="status" role="status"></div>
<p class="note">Only empty recognized fields are filled. Neural Ant does not submit or read what you type. Review answers and complete personal attestations yourself.</p>
<script src="popup.js"></script>
</html>
