services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neural_ant}
      POSTGRES_USER: ${POSTGRES_USER:-neural_ant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neural_ant} -d ${POSTGRES_DB:-neural_ant}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://neural_ant:${POSTGRES_PASSWORD}@db:5432/neural_ant}
      UPLOAD_DIR: /data/resumes
    ports:
      - "8080:8080"
    volumes:
      - resume_data:/data/resumes
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  resume_data:
